<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --moss:#6fa05a; --forest:#13211a; --pine:#3d7350; --leaf:#8fb572;
  --bark:#c9a87a; --bark-l:#5a6b5c; --sand:#e8dcc3; --mist:#1d2b23; --paper:#2a3a30;
  --ink:#e6eddc; --cell:40px; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--mist);color:var(--ink);font:400 15px/1.5 "Montserrat",system-ui,sans-serif}
header{background:var(--forest);color:var(--sand);position:relative;overflow:hidden}
header .txt{max-width:1180px;margin:0 auto;padding:36px 20px 96px;position:relative;z-index:1}
h1{margin:0;font-weight:800;font-size:clamp(28px,5vw,46px);letter-spacing:-.02em;line-height:1.1}
header p{margin:0;max-width:560px;color:#c9d8bd}
header svg{position:absolute;left:0;bottom:-1px;width:100%;height:110px}
main{max-width:1180px;margin:0 auto;padding:20px 12px 48px}
.layout{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media (min-width:980px){main{padding:28px 20px 64px}.layout{grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:start}}
.panel{background:var(--paper);border:1.5px solid #3d5143;border-radius:14px;padding:16px}
#now{min-height:44px;margin:0 0 12px;padding:10px 12px;border-radius:8px;background:#34463a;color:var(--bark);font-weight:600;font-size:14px}
.boardwrap{overflow-x:auto;padding:2px}
#board{display:grid;gap:2px;width:max-content;margin:0 auto;
  grid-template-columns:repeat(var(--cols),var(--cell));grid-template-rows:repeat(var(--rows),var(--cell))}
.cell{position:relative;background:#3a4f42;border:1.5px solid var(--bark-l);border-radius:3px}
.cell input{width:100%;height:100%;border:0;padding:0;background:transparent;text-align:center;border-radius:3px;
  font:700 calc(var(--cell)*.52) "Montserrat",sans-serif;color:var(--ink);text-transform:uppercase;caret-color:transparent;outline:none}
.num{position:absolute;top:1px;left:2px;font:600 max(7px,calc(var(--cell)*.26))/1 "Montserrat",sans-serif;color:var(--bark);pointer-events:none}
.cell.hl{background:#4f7049}
.cell.cur{outline:2.5px solid var(--bark);outline-offset:-2px;z-index:1}
.cell.ok{background:#3f7f3c;border-color:#7cc46a}.cell.ok input{color:#f1ffe9}
.cell.bad{background:#8e3a30;border-color:#d9776a}.cell.bad input{color:#ffe9e5}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
button{font:600 14px "Montserrat",sans-serif;cursor:pointer;border-radius:999px;padding:10px 18px;border:1.5px solid transparent;transition:background .15s,color .15s}
button:focus-visible{outline:3px solid #d8a94a;outline-offset:2px}
.primary{background:var(--pine);color:#fff}.primary:hover{background:#4a8a60}
.outline{background:transparent;color:var(--bark);border-color:var(--bark)}.outline:hover{background:#34463a}
.ghost{background:transparent;color:#a9b5a0;border-color:#4d6052}.ghost:hover{background:#2f4237}
#msg{flex-basis:100%;min-height:22px;margin:2px 0 0;font-size:13px;color:var(--bark)}
.clues{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.clues h2{margin:0 0 8px;font-size:17px;font-weight:700;color:#9cc487}
.clues ol{list-style:none;margin:0;padding:0}
.clue{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:start;width:100%;text-align:left;
  background:transparent;border-radius:8px;border:0;padding:7px 8px;font-weight:500;font-size:14px;color:var(--ink)}
.clue:hover{background:#34463a}
.clue .cn{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#3b4f41;color:#d9c7a3;font-weight:700;font-size:12px}
.clue .ln{color:#93a08a;font-size:12px;padding-top:3px}
li.active .clue{background:#3f5a46;box-shadow:inset 3px 0 0 var(--bark)}
li.done .clue{color:#8fa384}
li.done .cn{background:var(--moss);color:#fff}
#progress{margin:14px 0 0;font-size:13px;color:#93a08a}
#reveal{position:relative;overflow:hidden;margin-top:28px;border-radius:16px;background:var(--forest);color:var(--sand);padding:36px 16px 40px;text-align:center}
#reveal[hidden]{display:none}
#reveal h2{margin:0 0 22px;font-size:15px;font-weight:600;color:#a9c295;position:relative;z-index:1}
.phrase{display:flex;flex-wrap:wrap;justify-content:center;gap:18px 30px;position:relative;z-index:1;--t:clamp(24px,8.2vw,46px)}
.pw{display:flex;gap:3px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;width:var(--t);height:calc(var(--t)*1.3);
  border:2px dashed #4d6052;border-radius:6px;background:transparent;color:var(--forest);
  font-weight:800;font-size:calc(var(--t)*.56);line-height:1}
.tile .l{min-height:1em}
.tile small{font-size:max(7px,calc(var(--t)*.2));font-weight:600;color:#7d8f80;margin-top:3px}
.tile.on{background:var(--sand);border:2px solid var(--sand)}
.tile.on small{color:#6b4a33}
.tile.pop{animation:pop .5s cubic-bezier(.2,.9,.3,1.3)}
.celebrate .tile.on{animation:wave .9s ease-in-out calc(var(--i)*80ms) 2}
@keyframes pop{from{opacity:.3;transform:scale(.4) rotate(-10deg)}to{opacity:1;transform:none}}
@keyframes wave{0%,100%{transform:none}50%{transform:translateY(-12px)}}
.leaf{position:absolute;top:-20px;width:14px;height:14px;border-radius:0 100% 0 100%;opacity:0;
  animation:fall var(--dur) linear var(--del) 2 both}
@keyframes fall{0%{opacity:0;transform:translate(0,0) rotate(0)}10%{opacity:.9}90%{opacity:.8}100%{opacity:0;transform:translate(var(--dx),420px) rotate(600deg)}}
@media (prefers-reduced-motion:reduce){.tile,.celebrate .tile.on{animation:none!important}.leaf{display:none}}
</style>
</head>
<body>
<header>
  <div class="txt">
    <h1>Quiz</h1>
  </div>
  <svg viewBox="0 0 1200 110" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs><polygon id="pine" points="0,0 12,22 6,22 16,42 4,42 18,64 -18,64 -4,42 -16,42 -6,22 -12,22"/></defs>
    <path fill="#2f5d3f" d="M0 110V62l110-38 90 34 130-46 150 62 110-30 140 56 120-46 150 54 90-24 110 40v36z"/>
    <path fill="#1d2b23" d="M0 110V86l90-26 120 30 100-34 150 40 120-26 160 34 130-30 130 28 200-18v36z"/>
    <g fill="#16291f">
      <use href="#pine" transform="translate(40,46)"/><use href="#pine" transform="translate(120,56) scale(.8)"/>
      <use href="#pine" transform="translate(240,42) scale(1.1)"/><use href="#pine" transform="translate(380,58) scale(.8)"/>
      <use href="#pine" transform="translate(520,48)"/><use href="#pine" transform="translate(610,60) scale(.75)"/>
      <use href="#pine" transform="translate(740,44) scale(1.1)"/><use href="#pine" transform="translate(850,58) scale(.85)"/>
      <use href="#pine" transform="translate(960,46)"/><use href="#pine" transform="translate(1060,56) scale(.8)"/>
      <use href="#pine" transform="translate(1150,44) scale(1.1)"/>
    </g>
  </svg>
</header>

<main>
  <div class="layout">
    <section class="panel" aria-label="Crossword grid">
      <p id="now">Select a cell or a clue to begin.</p>
      <div class="boardwrap"><div id="board"></div></div>
      <div class="tools">
        <button class="primary" id="check">Check answers</button>
        <button class="outline" id="show">Show answers</button>
        <button class="ghost" id="reset">Reset</button>
        <p id="msg" role="status" aria-live="polite"></p>
      </div>
    </section>

    <section class="panel" aria-label="Clues">
      <div class="clues">
        <div><h2>Across</h2><ol id="across"></ol></div>
        <div><h2>Down</h2><ol id="down"></ol></div>
      </div>
      <p id="progress"></p>
    </section>
  </div>

  <section id="reveal" aria-live="polite">
    <h2 id="revealTitle">Hidden message</h2>
    <div class="phrase" id="phrase" aria-label="ENDLESS EVERGREEN FOREST"></div>
  </section>
</main>

<script>
// Each word: n = clue number, d = A (across) / D (down), x,y = start cell, a = answer.
// Coordinates were generated and verified so that every crossing shares the same letter.
const WORDS=[{"n":1,"d":"A","x":8,"y":10,"a":"EAST"},{"n":2,"d":"A","x":6,"y":0,"a":"NEST"},{"n":3,"d":"A","x":8,"y":4,"a":"DELL"},{"n":4,"d":"A","x":10,"y":8,"a":"LAVA"},{"n":5,"d":"A","x":0,"y":3,"a":"ELEPHANT"},{"n":6,"d":"A","x":5,"y":5,"a":"SUN"},{"n":7,"d":"A","x":7,"y":2,"a":"SNOW"},{"n":8,"d":"A","x":4,"y":8,"a":"EARTH"},{"n":9,"d":"A","x":4,"y":12,"a":"VOLCANO"},{"n":10,"d":"A","x":11,"y":5,"a":"EYE"},{"n":11,"d":"A","x":0,"y":9,"a":"RIVER"},{"n":12,"d":"D","x":5,"y":1,"a":"GRASS"},{"n":13,"d":"D","x":0,"y":1,"a":"REEF"},{"n":14,"d":"D","x":7,"y":0,"a":"EAST"},{"n":15,"d":"D","x":11,"y":3,"a":"ELEPHANT"},{"n":16,"d":"D","x":7,"y":5,"a":"NEST"},{"n":17,"d":"D","x":4,"y":7,"a":"FERN"},{"n":18,"d":"D","x":9,"y":2,"a":"OCEAN"},{"n":19,"d":"D","x":2,"y":7,"a":"RIVER"},{"n":20,"d":"D","x":0,"y":7,"a":"EARTH"},{"n":21,"d":"D","x":10,"y":10,"a":"SNOW"},{"n":22,"d":"D","x":2,"y":1,"a":"TREE"}];
const CLUES={1:"The opposite of “west”",2:"Place where a bird lives",3:"A small valley",4:"Molten rock from a volcano",5:"A very large animal with a trunk",6:"The star that gives us light",7:"White flakes falling from the sky",8:"The planet we live on",9:"A mountain that erupts",10:"A part of the body used for seeing",11:"A large natural stream of water",12:"A large area of land covered with grass",13:"A colorful coral ridge",14:"The opposite of “west”",15:"A large animal with a trunk",16:"Place where a bird lives",17:"A small green plant with feathers",18:"A large body of salt water",19:"A large natural stream of water",20:"The planet we live on",21:"White flakes falling from the sky",22:"A tall plant with a trunk"};
const KEY='evergreen-crossword-v1';
const $=s=>document.querySelector(s);

// ---------- model ----------
const words=WORDS.map(w=>({...w,len:w.a.length,cells:[]}));
const cells=new Map();
words.forEach(w=>{
  for(let i=0;i<w.len;i++){
    const x=w.d==='A'?w.x+i:w.x, y=w.d==='A'?w.y:w.y+i, k=x+','+y;
    let c=cells.get(k);
    if(!c){c={x,y,k,ch:w.a[i],words:{},nums:[]};cells.set(k,c)}
    c.words[w.d]=w; w.cells.push(c);
    if(i===0)c.nums.push(w.n);
  }
});
const COLS=Math.max(...[...cells.values()].map(c=>c.x))+1;
const ROWS=Math.max(...[...cells.values()].map(c=>c.y))+1;

let activeWord=null, activeCell=null, pref='A', wasCur=false, revealed=false;

// ---------- build grid ----------
const board=$('#board');
board.style.setProperty('--cols',COLS);
board.style.setProperty('--rows',ROWS);
cells.forEach(c=>{
  const el=document.createElement('div');
  el.className='cell';
  el.style.gridColumn=c.x+1; el.style.gridRow=c.y+1;
  if(c.nums.length){const n=document.createElement('span');n.className='num';n.textContent=c.nums.join('/');el.appendChild(n)}
  const inp=document.createElement('input');
  inp.type='text'; inp.autocomplete='off'; inp.spellcheck=false;
  inp.setAttribute('autocapitalize','characters'); inp.setAttribute('autocorrect','off');
  inp.setAttribute('aria-label','Row '+(c.y+1)+', column '+(c.x+1));
  el.appendChild(inp); board.appendChild(el);
  c.el=el; c.input=inp;

  el.addEventListener('pointerdown',()=>{wasCur=(c===activeCell)});
  el.addEventListener('click',()=>{
    if(wasCur&&c.words.A&&c.words.D&&activeWord) selectCell(c,activeWord.d==='A'?'D':'A');
    wasCur=false;
  });
  inp.addEventListener('focus',()=>{selectCell(c);setTimeout(()=>inp.select(),0)});
  inp.addEventListener('input',()=>{
    const m=inp.value.toUpperCase().match(/[A-Z]/g);
    inp.value=m?m[m.length-1]:'';
    el.classList.remove('ok','bad'); save(); update();
    if(inp.value) step(1);
  });
  inp.addEventListener('keydown',e=>{
    const k=e.key;
    if(k==='Backspace'){
      e.preventDefault();
      if(inp.value){inp.value='';el.classList.remove('ok','bad');save();update()}
      else step(-1,true);
    }else if(k.startsWith('Arrow')){
      e.preventDefault();
      const dx=k==='ArrowLeft'?-1:k==='ArrowRight'?1:0, dy=k==='ArrowUp'?-1:k==='ArrowDown'?1:0;
      const n=cells.get((c.x+dx)+','+(c.y+dy));
      if(n){pref=dx?'A':'D';n.input.focus()}
    }else if(k===' '){e.preventDefault()}
  });
});

// ---------- build clue lists ----------
words.forEach(w=>{
  const li=document.createElement('li');
  const b=document.createElement('button');
  b.className='clue'; b.type='button';
  b.innerHTML='<span class="cn">'+w.n+'</span><span>'+CLUES[w.n]+'</span><span class="ln">('+w.len+')</span>';
  b.addEventListener('click',()=>{
    activeWord=w; pref=w.d;
    const target=w.cells.find(c=>!c.input.value)||w.cells[0];
    target.input.focus();
    paint();
    $('.boardwrap').scrollIntoView({block:'nearest',behavior:'smooth'});
  });
  li.appendChild(b); w.li=li;
  $(w.d==='A'?'#across':'#down').appendChild(li);
});

// ---------- selection ----------
function selectCell(c,dir){
  let w=dir&&c.words[dir];
  if(!w) w=(activeWord&&activeWord.cells.includes(c))?activeWord:(c.words[pref]||c.words.A||c.words.D);
  activeWord=w; activeCell=c; pref=w.d; paint();
}
function paint(){
  cells.forEach(c=>{
    c.el.classList.toggle('hl',!!activeWord&&activeWord.cells.includes(c));
    c.el.classList.toggle('cur',c===activeCell);
  });
  words.forEach(w=>w.li.classList.toggle('active',w===activeWord));
  if(activeWord) $('#now').textContent=activeWord.n+' '+(activeWord.d==='A'?'Across':'Down')+': '+CLUES[activeWord.n]+' ('+activeWord.len+')';
}
function step(dir,clear){
  if(!activeWord||!activeCell) return;
  const n=activeWord.cells[activeWord.cells.indexOf(activeCell)+dir];
  if(!n) return;
  if(clear){n.input.value='';n.el.classList.remove('ok','bad');save();update()}
  n.input.focus();
}

// ---------- state ----------
function save(){
  try{
    const o={}; cells.forEach(c=>{if(c.input.value)o[c.k]=c.input.value});
    localStorage.setItem(KEY,JSON.stringify(o));
  }catch(e){}
}
function load(){
  try{
    const o=JSON.parse(localStorage.getItem(KEY)||'{}');
    for(const k in o){const c=cells.get(k);if(c&&/^[A-Z]$/.test(o[k]))c.input.value=o[k]}
  }catch(e){}
}
function msg(t){$('#msg').textContent=t}
function clearMarks(){cells.forEach(c=>c.el.classList.remove('ok','bad'))}

function update(initial){
  let solved=0;
  words.forEach(w=>{
    const ok=w.cells.every(c=>c.input.value===c.ch);
    w.li.classList.toggle('done',ok); if(ok)solved++;
    const t=w.tile, on=t.classList.contains('on');
    if(ok&&!on){
      t.querySelector('.l').textContent=w.a[0]; t.classList.add('on');
      if(!initial){t.classList.remove('pop');void t.offsetWidth;t.classList.add('pop')}
    }else if(!ok&&on){
      t.classList.remove('on','pop'); t.querySelector('.l').textContent='';
    }
  });
  $('#progress').textContent=solved+' of '+words.length+' words solved';
  if(solved===words.length&&!revealed) win(!initial);
  else if(solved<words.length&&revealed) unwin();
}

// ---------- buttons ----------
$('#check').addEventListener('click',()=>{
  let ok=0,bad=0,empty=0;
  cells.forEach(c=>{
    const v=c.input.value; c.el.classList.remove('ok','bad');
    if(!v){empty++;return}
    if(v===c.ch){ok++;c.el.classList.add('ok')}else{bad++;c.el.classList.add('bad')}
  });
  msg(bad===0&&empty===0?'Every letter is correct.':ok+' correct, '+bad+' wrong, '+empty+' empty.');
});
$('#show').addEventListener('click',()=>{
  clearMarks(); cells.forEach(c=>{c.input.value=c.ch});
  save(); update(); msg('All answers are shown.');
});
$('#reset').addEventListener('click',()=>{
  clearMarks(); cells.forEach(c=>{c.input.value=''});
  try{localStorage.removeItem(KEY)}catch(e){}
  activeWord=null; activeCell=null; paint();
  $('#now').textContent='Select a cell or a clue to begin.';
  update(); msg('Crossword cleared.');
});

// ---------- hidden phrase ----------
const sorted=[...words].sort((a,b)=>a.n-b.n);
(function(){
  const box=$('#phrase'); let i=0;
  [7,9,6].forEach(len=>{
    const g=document.createElement('div'); g.className='pw';
    for(let j=0;j<len;j++,i++){
      const w=sorted[i], t=document.createElement('div');
      t.className='tile'; t.style.setProperty('--i',i);
      t.innerHTML='<span class="l"></span><small>'+w.n+'</small>';
      g.appendChild(t); w.tile=t;
    }
    box.appendChild(g);
  });
})();
function win(animate){
  revealed=true;
  const sec=$('#reveal');
  $('#revealTitle').textContent='Hidden message found';
  if(animate){
    sec.classList.add('celebrate');
    const colors=['#8fb572','#5f8a4e','#b98b58','#6b4a33','#a9c295'];
    for(let k=0;k<16;k++){
      const lf=document.createElement('span'); lf.className='leaf';
      lf.style.left=(Math.random()*96)+'%';
      lf.style.background=colors[k%colors.length];
      lf.style.setProperty('--dx',(Math.random()*120-60)+'px');
      lf.style.setProperty('--dur',(3+Math.random()*2.5)+'s');
      lf.style.setProperty('--del',(Math.random()*2)+'s');
      sec.appendChild(lf);
    }
    setTimeout(()=>sec.querySelectorAll('.leaf').forEach(l=>l.remove()),13000);
    sec.scrollIntoView({behavior:'smooth',block:'center'});
  }
}
function unwin(){
  revealed=false;
  const sec=$('#reveal');
  sec.classList.remove('celebrate'); sec.querySelectorAll('.leaf').forEach(l=>l.remove());
  $('#revealTitle').textContent='Hidden message';
}

// ---------- responsive cell size ----------
function fit(){
  const wide=window.innerWidth>=980;
  let size=40;
  if(!wide){
    const avail=$('main').clientWidth-24-34;
    size=Math.max(22,Math.min(40,Math.floor((avail-(COLS-1)*2)/COLS)));
  }
  document.documentElement.style.setProperty('--cell',size+'px');
}
window.addEventListener('resize',fit);

fit(); load(); update(true);
</script>
</body>
</html>
